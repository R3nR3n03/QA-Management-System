# Continuous integration for QAMS (PRODUCTION-READINESS-2026-07-31.md D1).
#
# WHAT THIS IS: pipeline-as-code that mirrors the four gates declared in
# relay.config.json. Until now those gates had only ever run because a person or an
# agent invoked them by hand.
#
# WHAT THIS IS NOT — do not let anything imply otherwise:
#   * It has NEVER EXECUTED. This repository has no git remote, nothing has been
#     pushed anywhere, and no pull request has ever been opened. This file is correct
#     by inspection only.
#   * It is not branch protection, not a required status check, and not a deploy.
#     Those are settings on a forge that does not host this repository yet.
#   * There is no container image. `docker` is not installed on the machine this was
#     written on, so a Dockerfile would have shipped unbuilt and unverifiable.
#     `output: "standalone"` in next.config.ts produces the deployable artefact
#     (.next/standalone/server.js) and IS verified, because `npm run build` is a gate.
#
# KNOWN RISK — the most likely reason the first real run fails:
#   package.json pins `xlsx` to https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
#   rather than to the npm registry (the package was pulled from npm). `npm ci`
#   therefore needs egress to cdn.sheetjs.com. On a runner with restricted egress, or
#   behind an artifact proxy that only mirrors the registry, install fails outright.
#   The fix is to mirror that tarball into an internal registry, not to unpin it.
#
# The `gates` job defines no Postgres service, deliberately: every test in
# src/**/*.test.ts is a pure unit test with no database, no mocks and no fixtures.
# The DB-backed acceptance suite (tests/acceptance/, docs/testing-and-acceptance.md)
# runs as its own `acceptance` job against a service container, so a unit-gate
# failure and an acceptance failure stay distinguishable at a glance.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: build, lint, test, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No Postgres service is started here (see note above) — prisma.config.ts still
    # requires DATABASE_URL to be *set* for `prisma generate` to load its config, even
    # though generate never opens a connection. A placeholder satisfies that.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qams_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the version this project is developed and verified against.
      # package.json declares no `engines` field (D2, still open), so this file is
      # currently the only thing stating a supported runtime anywhere.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm

      # `ci`, not `install`: package-lock.json is committed and must be honoured
      # exactly. See the xlsx egress note at the top of this file.
      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated output and is not committed, so typecheck and
      # build both fail without this. No database is contacted.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Advisory, matching relay.config.json's gates.advisory. It is still worth
      # running: src/ui/error-copy.ts holds an exhaustive Record<ErrorCode, ErrorCopy>,
      # so this step is what fires if someone adds an ErrorCode without adding copy.
      - name: Typecheck (advisory)
        run: npm run typecheck
        continue-on-error: true

  # The acceptance scenarios from docs/testing-and-acceptance.md, which its line 38
  # makes the definition of done. The suite's global setup creates and migrates the
  # qams_test database itself (tests/acceptance/global-setup.ts), so this job only
  # has to provide a reachable PostgreSQL and the connection URL.
  acceptance:
    name: acceptance scenarios (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qams?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Acceptance suite
        run: npm run test:acceptance
